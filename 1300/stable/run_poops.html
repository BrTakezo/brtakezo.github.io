<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PKG Brasil // 11.00-13.00 POOPS</title>
<style>
@property --angle { syntax:'<angle>'; initial-value:0deg; inherits:false; }

:root {
    --bg: #070707; --surface: #0e0e0e; --line: #1f1f1f; --lb: #2c2c2c;
    --text: #f5f5f5; --muted: #b5b5b5; --dim: #666;
    --y: #f5c518; --y-dim: #c49a10; --y-bg: rgba(245,197,24,.07); --y-glow: rgba(245,197,24,.22);
    --red: #ff9b9b; --amber: #e1bd72;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body {
    background:var(--bg);
    background-image: linear-gradient(rgba(245,197,24,.03) 1px,transparent 1px), linear-gradient(90deg,rgba(245,197,24,.03) 1px,transparent 1px);
    background-size:36px 36px;
    color:var(--text); font:16px/1.5 Consolas,"Liberation Mono",monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:20px 16px; overflow-x:hidden;
}
#state,#out { position:absolute; left:-9999px; top:-9999px; width:1px; height:1px; overflow:hidden; }
.bar {
    position:fixed; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--lb); background:var(--bg);
    font-size:13px; letter-spacing:.1em; text-transform:uppercase; padding:10px 20px; z-index:10;
}
.bar b { color:var(--y); font-weight:400; }
.bar-right { color:var(--dim); }
.bar-right::before { color:var(--y); content:"\25CF "; }
.wrap { position:relative; padding:3px; border-radius:26px; width:min(92vw,440px); animation:panelIn .5s cubic-bezier(.22,1,.36,1); }
.wrap::before {
    content:''; position:absolute; inset:-2px; border-radius:28px; z-index:0;
    background:conic-gradient(from var(--angle),transparent 25%,var(--y) 50%,transparent 75%);
    animation:rotateBorder 2.5s linear infinite; opacity:.7;
}
@keyframes rotateBorder { to { --angle:360deg; } }
@keyframes panelIn { from{opacity:0;transform:scale(.92) translateY(24px)} to{opacity:1;transform:scale(1) translateY(0)} }
.inner {
    position:relative; z-index:1; background:var(--surface); border-radius:24px;
    padding:clamp(32px,5vw,52px) clamp(28px,5vw,56px); text-align:center; overflow:hidden;
}
.inner::before {
    content:''; position:absolute; top:-80px; left:50%; translate:-50% 0;
    width:300px; height:300px;
    background:radial-gradient(circle,rgba(245,197,24,.07) 0%,transparent 65%); pointer-events:none;
}
.fw-badge {
    display:inline-flex; align-items:center; background:var(--y-bg);
    border:1px solid var(--y-glow); border-radius:99px; padding:4px 16px;
    font-size:.72rem; color:var(--y); font-weight:700; text-transform:uppercase; letter-spacing:.1em;
    margin-bottom:clamp(20px,3vh,32px);
}
.pct-num {
    font-size:clamp(5rem,22vw,8.5rem); font-weight:700; color:var(--y);
    line-height:1; letter-spacing:-.04em; font-variant-numeric:tabular-nums;
    margin-bottom:clamp(16px,2.5vh,26px); font-family:Consolas,monospace;
}
.pct-sym { font-size:38%; vertical-align:top; margin-top:.2em; display:inline-block; color:var(--y-dim); }
.prog-track { height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:clamp(10px,2vh,18px); position:relative; }
.prog-bar {
    height:100%; width:0%; background:linear-gradient(90deg,var(--y-dim),var(--y));
    border-radius:99px; transition:width .14s linear; position:relative;
}
.prog-bar::after {
    content:''; position:absolute; right:-4px; top:50%; translate:0 -50%;
    width:12px; height:12px; border-radius:50%; background:var(--y);
    box-shadow:0 0 10px 4px rgba(245,197,24,.5); opacity:0; transition:opacity .2s;
}
.prog-bar.glow::after { opacity:1; }
.prog-status { font-size:.82rem; color:var(--muted); min-height:1.4em; transition:color .3s; }
.prog-status.err { color:var(--red); }
.prog-status.ok  { color:var(--y); }
#particles { position:fixed; inset:0; pointer-events:none; z-index:9999; }
.particle { position:absolute; width:6px; height:6px; background:var(--y); border-radius:50%; animation:fly .65s ease-out forwards; }
.particle.s { width:3px; height:3px; background:#fff; }
@keyframes fly { 0%{opacity:1;transform:translate(0,0) scale(1)} 100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)} }
</style>
</head>
<body>
    <div id="state">loading poops chain...</div>
    <div id="out"></div>
    <div id="particles"></div>
    <header class="bar">
        <span><b>PKG Brasil</b> // desbloqueio ps4</span>
        <span class="bar-right">fw 11.00-13.00</span>
    </header>
    <div class="wrap">
        <div class="inner">
            <div class="fw-badge">FW 11.00 – 13.00</div>
            <div class="pct-num" id="prog-pct">0<span class="pct-sym">%</span></div>
            <div class="prog-track"><div class="prog-bar" id="prog-bar"></div></div>
            <div class="prog-status" id="prog-status">Carregando exploit…</div>
        </div>
    </div>
<script type="module">import "./chain_poops.js";</script>
<script>
(function(){
var KEY="pspulse-slopkit-reloads",MAX=2,WINDOW_MS=600000,handled=false;
function readBudget(){var rec=null;try{rec=JSON.parse(sessionStorage.getItem(KEY)||"null")}catch(e){rec=null}var now=Date.now();if(!rec||typeof rec.n!=="number"||(now-rec.t)>WINDOW_MS)return{n:0,t:now};return rec}
function spendBudget(){var rec=readBudget();rec.n++;rec.t=Date.now();try{sessionStorage.setItem(KEY,JSON.stringify(rec));var check=JSON.parse(sessionStorage.getItem(KEY)||"null");if(check&&check.n===rec.n)return rec}catch(e){}return null}
setInterval(function(){try{if(handled)return;var st=document.getElementById("state");if(st&&st.className==="ok"){try{sessionStorage.removeItem(KEY)}catch(e){}handled=true;return}if(!st||st.textContent.indexOf("FAILED")===-1)return;var out=document.getElementById("out");var txt=out?out.textContent:"";if(txt.indexOf("attempt-ceiling")===-1)return;handled=true;var rec=spendBudget();if(!rec||rec.n>MAX)return;st.textContent="heap layout missed -- reloading ("+rec.n+"/2)...";st.className="warn";setTimeout(function(){location.reload()},2000)}catch(e){}},3000);
})();

(function(){
var pctEl=document.getElementById("prog-pct"),barEl=document.getElementById("prog-bar"),statusEl=document.getElementById("prog-status"),stateEl=document.getElementById("state"),parEl=document.getElementById("particles");
var current=0,target=12,done=false,raf;
var PHASES=[{at:0,text:"Inicializando…"},{at:15,text:"Carregando exploit…"},{at:40,text:"Aplicando patches…"},{at:65,text:"Executando cadeia…"},{at:85,text:"Finalizando…"},{at:99,text:"Pronto!"}];
function speed(p){return p<30?1.2:p<60?.6:p<80?.3:p<95?.15:1.6}
function setStatus(txt,cls){statusEl.textContent=txt;statusEl.className="prog-status"+(cls?" "+cls:"")}
function updatePhase(p){var phase=null;for(var i=0;i<PHASES.length;i++){if(p>=PHASES[i].at)phase=PHASES[i]}if(phase)setStatus(phase.text)}
function setBar(p){var r=Math.floor(p);pctEl.innerHTML=r+'<span class="pct-sym">%</span>';barEl.style.width=p+"%";if(p>5)barEl.classList.add("glow")}
function burst(){var rect=barEl.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;for(var i=0;i<26;i++){var p=document.createElement("div");p.className=(i%3===0)?"particle s":"particle";var angle=(i/26)*360+Math.random()*10,dist=50+Math.random()*90;p.style.cssText="left:"+cx+"px;top:"+cy+"px;--tx:"+(Math.cos(angle*Math.PI/180)*dist)+"px;--ty:"+(Math.sin(angle*Math.PI/180)*dist)+"px;animation-delay:"+(Math.random()*.08)+"s;animation-duration:"+(.45+Math.random()*.25)+"s;";parEl.appendChild(p);p.addEventListener("animationend",function(){this.remove()},false)}}
function finish(success){done=true;cancelAnimationFrame(raf);if(success){var snap=setInterval(function(){current=Math.min(100,current+2.2);setBar(current);if(current>=99)updatePhase(100);if(current>=100){clearInterval(snap);burst();setStatus("Exploit aplicado com sucesso!","ok")}},16)}else{setBar(current);setStatus("Falha — recarregando…","err")}}
function tick(){if(done)return;if(current<target){current=Math.min(target,current+speed(current)*(Math.random()*.5+.75))}setBar(current);updatePhase(Math.floor(current));raf=requestAnimationFrame(tick)}
var rampInterval=setInterval(function(){if(done){clearInterval(rampInterval);return}if(target<85)target=Math.min(85,target+(Math.random()*3+1))},800);
var observer=new MutationObserver(function(){if(done)return;var txt=stateEl.textContent,cls=stateEl.className;if(cls==="ok"){clearInterval(rampInterval);finish(true)}else if(txt==="threw"||txt.indexOf("FAILED")!==-1){clearInterval(rampInterval);setTimeout(function(){finish(false)},400)}else if(txt.indexOf("reloading")!==-1){setStatus("Recarregando…")}});
observer.observe(stateEl,{childList:true,characterData:true,subtree:true});
raf=requestAnimationFrame(tick);
})();
</script>
</body>
</html>
